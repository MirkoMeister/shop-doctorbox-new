version: 2
updates:
  # npm dependencies: weekly, grouped so the PR noise stays low
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
      dev-tooling:
        dependency-type: "development"
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # major upgrades of the framework are reviewed by hand
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # keep GitHub Actions (if added later) current as well
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
